name: Validate and publish Docker image

on:
  pull_request:
  push:
    branches-ignore:
      - "dependabot/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  IMAGE_NAME: tinywind0/norea-content-server
  LOCAL_IMAGE: norea-content-server-ci:${{ github.sha }}
  NODE_IMAGE: node:24-trixie-slim
  PYTHON_IMAGE: python:3.14-slim
  PNPM_VERSION: "11.25.0"

jobs:
  validate:
    name: Test and smoke-test the image
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      publish_requested: ${{ steps.publication.outputs.publish }}
      artifact_id: ${{ steps.image_artifact.outputs.artifact-id }}
      archive_sha256: ${{ steps.image_archive.outputs.sha256 }}
      image_config_digest: ${{ steps.image_archive.outputs.image_config_digest }}
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select release-branch publication
        id: publication
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/') && !startsWith(github.ref, 'refs/heads/dependabot/')
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$SOURCE_BRANCH" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "Validation only: $SOURCE_BRANCH is not a version branch such as 0.2." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: norea-content-server-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            norea-content-server-pnpm-

      - name: Install locked dependencies, check types, run tests, and build in Node container
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/container-home" "$RUNNER_TEMP/pnpm-store" "$RUNNER_TEMP/pnpm-global"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/container-home:/tmp/home" \
            -v "$RUNNER_TEMP/pnpm-store:/pnpm-store" \
            -v "$RUNNER_TEMP/pnpm-global:/pnpm-global" \
            -w /workspace \
            -e CI=true \
            -e HOME=/tmp/home \
            -e PNPM_STORE_DIR=/pnpm-store \
            -e NPM_CONFIG_PREFIX=/pnpm-global \
            -e NPM_CONFIG_CACHE=/tmp/home/.npm \
            -e PNPM_VERSION="$PNPM_VERSION" \
            "$NODE_IMAGE" \
            bash -euo pipefail -c '
              export PATH="/pnpm-global/bin:$PATH"
              npm install --global --no-audit --no-fund "pnpm@${PNPM_VERSION}"
              test "$(pnpm --version)" = "$PNPM_VERSION"
              pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR"
              pnpm typecheck
              pnpm test
              pnpm build
            '
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the committed image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # A Git context excludes generated or untracked files from the test job.
          context: https://github.com/${{ github.repository }}.git#${{ github.sha }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.LOCAL_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=norea-content-server-${{ github.event_name == 'pull_request' && 'pr' || 'trusted' }}
          cache-to: type=gha,mode=max,scope=norea-content-server-${{ github.event_name == 'pull_request' && 'pr' || 'trusted' }}

      - name: Smoke-test capabilities and built console assets
        run: |
          set -euo pipefail
          container_name="norea-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$container_name" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container_name" \
            --publish 127.0.0.1::8787 \
            --tmpfs /data:rw,uid=1000,gid=1000,mode=0700 \
            --env NOREA_HOST=0.0.0.0 --env NOREA_PORT=8787 --env NOREA_DATA_DIR=/data \
            "$LOCAL_IMAGE"
          if ! docker run --rm -i --network "container:$container_name" "$NODE_IMAGE" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { setTimeout as delay } from 'node:timers/promises';

          const baseUrl = 'http://127.0.0.1:8787';
          let capabilitiesResponse;
          for (let attempt = 0; attempt < 30; attempt++) {
            try {
              const response = await fetch(`${baseUrl}/api/v1/capabilities`, { signal: AbortSignal.timeout(2000) });
              if (response.ok) {
                capabilitiesResponse = response;
                break;
              }
            } catch {}
            await delay(1000);
          }
          assert.ok(capabilitiesResponse, 'server did not become ready within 30s');
          const capabilities = await capabilitiesResponse.json();
          for (const [key, value] of Object.entries({ apiVersion: 1, packageVersion: 1, authentication: 'device-key', personalStateSync: true, readingStateVersion: 1, deviceBackupVersion: 1 })) {
            assert.equal(capabilities[key], value, key);
          }
          const adminHtmlResponse = await fetch(`${baseUrl}/admin/`, { signal: AbortSignal.timeout(10000) });
          assert.ok(adminHtmlResponse.ok, `/admin/ returned ${adminHtmlResponse.status}`);
          assert.match(await adminHtmlResponse.text(), /<html[\s>]/i);
          const adminJsResponse = await fetch(`${baseUrl}/admin/admin.js`, { signal: AbortSignal.timeout(10000) });
          assert.ok(adminJsResponse.ok, `/admin/admin.js returned ${adminJsResponse.status}`);
          assert.ok((await adminJsResponse.text()).trim().length > 0, 'built admin.js must be present');
          NODE
          then
            docker logs "$container_name"
            exit 1
          fi

      - name: Export the exact smoke-tested image
        if: steps.publication.outputs.publish == 'true'
        id: image_archive
        run: |
          set -euo pipefail
          test "$(docker image inspect "$LOCAL_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          docker save --output "$RUNNER_TEMP/norea-image.tar" "$LOCAL_IMAGE"
          digest="$(docker run --rm -i --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP:/runner-temp:ro" \
            -e LOCAL_IMAGE \
            -e GITHUB_SHA \
            "$PYTHON_IMAGE" \
            python3 - <<'PY'
          import hashlib, json, os, tarfile
          with tarfile.open('/runner-temp/norea-image.tar') as archive:
              manifest = json.load(archive.extractfile('manifest.json'))
              matches = [item for item in manifest if os.environ['LOCAL_IMAGE'] in (item.get('RepoTags') or [])]
              assert len(matches) == 1, 'Archive must contain the one tested image tag'
              config_bytes = archive.extractfile(matches[0]['Config']).read()
              config = json.loads(config_bytes)
              assert config['os'] == 'linux' and config['architecture'] == 'amd64'
              assert config['config']['Labels']['org.opencontainers.image.revision'] == os.environ['GITHUB_SHA']
              print('sha256:' + hashlib.sha256(config_bytes).hexdigest())
          PY
          )"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image_config_digest=$digest" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/norea-image.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Transfer the tested image to the publishing job
        if: steps.publication.outputs.publish == 'true'
        id: image_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: norea-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/norea-image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  publish:
    name: Publish branch and latest tags
    needs: validate
    if: needs.validate.outputs.publish_requested == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: norea-content-server-dockerhub-publish
      cancel-in-progress: false
      queue: max
    env:
      SOURCE_BRANCH: ${{ github.ref_name }}
      EXPECTED_CONFIG_DIGEST: ${{ needs.validate.outputs.image_config_digest }}
      EXPECTED_ARCHIVE_SHA256: ${{ needs.validate.outputs.archive_sha256 }}
    steps:
      - name: Skip an outdated branch commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(docker run --rm -i \
            -e GH_TOKEN \
            -e GITHUB_REPOSITORY \
            -e SOURCE_BRANCH \
            "$NODE_IMAGE" \
            node --input-type=module <<'NODE'
          const branchPath = process.env.SOURCE_BRANCH.split('/').map(encodeURIComponent).join('/');
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/${branchPath}`, {
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'User-Agent': 'norea-content-server-ci',
              'X-GitHub-Api-Version': '2022-11-28',
            },
          });
          if (!response.ok) {
            throw new Error(`GitHub API ${response.status}: ${await response.text()}`);
          }
          const data = await response.json();
          console.log(data.object.sha);
          NODE
          )"
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo "Publication skipped: the branch has advanced beyond the tested commit." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download the exact tested image artifact
        if: steps.current.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          path: ${{ runner.temp }}/tested-image
          digest-mismatch: error

      - name: Verify the archive and image identity
        if: steps.current.outputs.publish == 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/tested-image/norea-image.tar"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$EXPECTED_ARCHIVE_SHA256"
          docker load --input "$archive"
          test "$(docker image inspect "$LOCAL_IMAGE" --format '{{.Os}}/{{.Architecture}}')" = 'linux/amd64'
          test "$(docker image inspect "$LOCAL_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"

      - name: Set up registry inspection
        if: steps.current.outputs.publish == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: steps.current.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish and verify the same image under branch and latest tags
        if: steps.current.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_branch_head() {
            docker run --rm -i \
              -e GH_TOKEN \
              -e GITHUB_REPOSITORY \
              -e SOURCE_BRANCH \
              "$NODE_IMAGE" \
              node --input-type=module <<'NODE'
          const branchPath = process.env.SOURCE_BRANCH.split('/').map(encodeURIComponent).join('/');
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/${branchPath}`, {
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'User-Agent': 'norea-content-server-ci',
              'X-GitHub-Api-Version': '2022-11-28',
            },
          });
          if (!response.ok) {
            throw new Error(`GitHub API ${response.status}: ${await response.text()}`);
          }
          const data = await response.json();
          console.log(data.object.sha);
          NODE
          }
          head="$(fetch_branch_head)"
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo 'Publication skipped: branch advanced while transferring the image.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker tag "$LOCAL_IMAGE" "$IMAGE_NAME:$SOURCE_BRANCH"
          docker push "$IMAGE_NAME:$SOURCE_BRANCH"
          docker buildx imagetools inspect "$IMAGE_NAME:$SOURCE_BRANCH" --raw > "$RUNNER_TEMP/registry-manifest.json"
          platform_digest="$(docker run --rm -i --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP:/runner-temp:ro" \
            "$NODE_IMAGE" \
            node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('/runner-temp/registry-manifest.json', 'utf8'));
          if (Array.isArray(manifest.manifests)) {
            const matches = manifest.manifests.filter(item => item?.platform?.os === 'linux' && item?.platform?.architecture === 'amd64');
            assert.equal(matches.length, 1, 'Registry index must contain one linux/amd64 image');
            console.log(matches[0].digest);
          }
          NODE
          )"
          if [[ -n "$platform_digest" ]]; then
            [[ "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            docker buildx imagetools inspect "$IMAGE_NAME@$platform_digest" --raw > "$RUNNER_TEMP/registry-manifest.json"
          fi
          docker run --rm -i --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP:/runner-temp:ro" \
            -e EXPECTED_CONFIG_DIGEST \
            "$NODE_IMAGE" \
            node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('/runner-temp/registry-manifest.json', 'utf8'));
          assert.equal(manifest.config.digest, process.env.EXPECTED_CONFIG_DIGEST, 'Published image differs from tested image');
          NODE
          digest="$(docker buildx imagetools inspect "$IMAGE_NAME:$SOURCE_BRANCH" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          latest='skipped because the branch advanced'
          head="$(fetch_branch_head)"
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            docker tag "$LOCAL_IMAGE" "$IMAGE_NAME:latest"
            docker push "$IMAGE_NAME:latest"
            test "$(docker buildx imagetools inspect "$IMAGE_NAME:latest" --format '{{.Manifest.Digest}}')" = "$digest"
            latest="$IMAGE_NAME:latest"
          fi
          {
            echo '## Published Docker image'
            echo "- Source commit: $GITHUB_SHA"
            echo "- Branch tag: $IMAGE_NAME:$SOURCE_BRANCH"
            echo "- Latest: $latest"
            echo "- Registry image: $IMAGE_NAME@$digest"
            echo "- Tested image configuration: $EXPECTED_CONFIG_DIGEST"
            echo '- Platform: linux/amd64'
            echo '- Publication complete; tinywind-SER rollout remains a separate completion step.'
          } >> "$GITHUB_STEP_SUMMARY"
